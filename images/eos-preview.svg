<svg xmlns="http://www.w3.org/2000/svg" width="390" height="800" viewBox="0 0 390 800" role="img" aria-label="Preview render of the Saudi EOS Calculator app">
<rect width="390" height="800" fill="#FAF7F0"/>
<rect x="0" y="0" width="390" height="800" fill="none" stroke="#1A1515" stroke-width="2"/>
<!-- top bar -->
<rect x="0" y="0" width="390" height="56" fill="#0F2040"/>
<text x="16" y="35" font-family="sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">Saudi EOS Calculator</text>
<text x="374" y="35" font-family="sans-serif" font-size="15" fill="#F2A900" text-anchor="end">عربي</text>
<!-- wage card -->
<rect x="16" y="72" width="358" height="104" rx="20" fill="#FFFFFF"/>
<text x="36" y="102" font-family="sans-serif" font-size="16" font-weight="600" fill="#17202E">Last monthly wage</text>
<text x="36" y="124" font-family="sans-serif" font-size="12" fill="#3D4A5C">Your last wage including fixed allowances.</text>
<rect x="36" y="136" width="318" height="28" fill="#EDF0F4"/>
<text x="48" y="155" font-family="sans-serif" font-size="14" fill="#17202E">10,000</text>
<text x="342" y="155" font-family="sans-serif" font-size="13" fill="#3D4A5C" text-anchor="end">SAR</text>
<!-- duration card -->
<rect x="16" y="192" width="358" height="112" rx="20" fill="#FFFFFF"/>
<text x="36" y="222" font-family="sans-serif" font-size="16" font-weight="600" fill="#17202E">Length of service</text>
<rect x="36" y="234" width="318" height="28" fill="#EDF0F4"/>
<text x="195" y="253" font-family="sans-serif" font-size="13" font-weight="600" fill="#0F2040" text-anchor="middle">Years &amp; months</text>
<text x="60" y="290" font-family="sans-serif" font-size="13" fill="#3D4A5C">Years of service</text>
<text x="60" y="310" font-family="sans-serif" font-size="16" font-weight="600" fill="#17202E">7</text>
<text x="220" y="290" font-family="sans-serif" font-size="13" fill="#3D4A5C">Extra months</text>
<text x="220" y="310" font-family="sans-serif" font-size="16" font-weight="600" fill="#17202E">0</text>
<text x="36" y="336" font-family="sans-serif" font-size="13" font-weight="600" fill="#007AFF">Service: 7 years</text>
<!-- reason card -->
<rect x="16" y="320" width="358" height="96" rx="20" fill="#FFFFFF"/>
<text x="36" y="350" font-family="sans-serif" font-size="16" font-weight="600" fill="#17202E">Reason the employment ended</text>
<rect x="36" y="360" width="318" height="40" rx="8" fill="#DCE6F5"/>
<text x="52" y="385" font-family="sans-serif" font-size="14" font-weight="600" fill="#17202E">Ended by the employer</text>
<text x="342" y="385" font-family="sans-serif" font-size="11" font-weight="600" fill="#0F2040" text-anchor="end">FULL AWARD</text>
<!-- result card -->
<rect x="16" y="432" width="358" height="252" rx="20" fill="#0F2040"/>
<text x="36" y="462" font-family="sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Your award</text>
<text x="36" y="482" font-family="sans-serif" font-size="12" fill="#B9C4D6">End-of-service award due</text>
<text x="36" y="522" font-family="sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">45,000 SAR</text>
<text x="36" y="546" font-family="sans-serif" font-size="14" font-weight="600" fill="#F2A900">Equals 4.5 months of wage</text>
<text x="36" y="578" font-family="sans-serif" font-size="13" fill="#FFFFFF">First 5 years (5 yrs x half a month)</text>
<text x="354" y="578" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="end">25,000</text>
<text x="36" y="600" font-family="sans-serif" font-size="13" fill="#FFFFFF">After 5 years (2 yrs x full month)</text>
<text x="354" y="600" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="end">20,000</text>
<text x="36" y="622" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Final amount due</text>
<text x="354" y="622" font-family="sans-serif" font-size="13" font-weight="700" fill="#F2A900" text-anchor="end">45,000 SAR</text>
<rect x="36" y="636" width="318" height="14" rx="7" fill="#4CC084"/>
<rect x="36" y="636" width="177" height="14" rx="7" fill="#F2A900"/>
<text x="36" y="668" font-family="sans-serif" font-size="11" fill="#B9C4D6">First 5 years (half month / year)  -  After 5 years (full month / year)</text>
<!-- bottom nav -->
<rect x="0" y="712" width="390" height="36" fill="#FFFFFF"/>
<text x="65" y="736" font-family="sans-serif" font-size="12" font-weight="600" fill="#0F2040" text-anchor="middle">Calculator</text>
<text x="195" y="736" font-family="sans-serif" font-size="12" fill="#3D4A5C" text-anchor="middle">Guide</text>
<text x="325" y="736" font-family="sans-serif" font-size="12" fill="#3D4A5C" text-anchor="middle">History</text>
<!-- preview label -->
<rect x="0" y="748" width="390" height="52" fill="#1A1515"/>
<text x="195" y="772" font-family="monospace" font-size="12" fill="#FFFFFF" text-anchor="middle">PREVIEW RENDER</text>
<text x="195" y="790" font-family="monospace" font-size="10" fill="#A39E9E" text-anchor="middle">BUILT FROM THE REAL APP UI - NOT A SCREENSHOT</text>
</svg>